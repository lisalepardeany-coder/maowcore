<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Listen room · MaowCore</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<style>
  :root { --bg:#1e1f22; --card:#2b2d31; --input:#1e1f22; --fg:#f2f3f5; --muted:#b5bac1; --border:#3f4147; --accent:#5865F2; }
  @media (prefers-color-scheme: light) { :root:not([data-embed]) { --bg:#f2f3f5; --card:#fff; --input:#ebedef; --fg:#1e1f22; --muted:#5c5e66; --border:#d4d7dc; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Inter, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  header img { width: 34px; height: 34px; border-radius: 50%; background: var(--card); }
  header img:not([src]) { display: none; }
  header h1 { font-size: 17px; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .np { display: flex; gap: 12px; align-items: center; }
  .np img { width: 96px; height: 54px; object-fit: cover; border-radius: 8px; background: var(--input); flex-shrink: 0; }
  .np .t { font-weight: 600; overflow-wrap: anywhere; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .bar { height: 4px; border-radius: 9px; background: var(--input); margin-top: 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 1s linear; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  ol { margin: 0; padding-left: 22px; }
  ol li { padding: 5px 0; border-top: 1px solid var(--border); overflow-wrap: anywhere; }
  ol li:first-child { border-top: 0; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--input); color: var(--fg); font: inherit; }
  button { padding: 10px 14px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; min-height: 42px; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { min-height: 1.2em; font-size: 12.5px; margin-top: 8px; }
  .msg.err { color: #f87171; } .msg.ok { color: #22c55e; }
  .center { text-align: center; padding: 30px 14px; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 99px; background: color-mix(in srgb, var(--accent) 25%, transparent); margin: 2px 2px 0 0; }
  .player { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .player .vol { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 140px; }
  .player .vol input { flex: 1; padding: 0; accent-color: var(--accent); }
  .player button.on { background: #ef4444; }
  .player .state { flex-basis: 100%; }
  .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; margin-right: 4px; vertical-align: -1px; }
  .eq i { width: 3px; background: var(--accent); border-radius: 2px; animation: eq .9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: .2s; } .eq i:nth-child(3) { animation-delay: .4s; }
  @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 12px; } }
  .np-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .np-row .muted { flex: 1; }
  button.ghost { background: var(--input); color: var(--fg); border: 1px solid var(--border); }
  .results { list-style: none; padding: 0; margin: 10px 0 0; }
  .results li { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--border); }
  .results li:first-child { border-top: 0; }
  .results img { width: 64px; height: 36px; object-fit: cover; border-radius: 6px; background: var(--input); flex-shrink: 0; }
  .results .info { flex: 1; min-width: 0; }
  .results .info div:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .results button { min-height: 34px; padding: 6px 12px; }
  [data-embed] .wrap { padding-top: 10px; }
  [data-embed] header { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header><img id="srv-icon" alt="" /><div><h1 id="srv-name">Listen room</h1><div class="sub" id="you"></div></div></header>
  <!-- Outside #app: that part is redrawn every few seconds, this must keep playing. -->
  <div class="card player" id="player" hidden>
    <button id="listen-btn" type="button">🎧 Listen here</button>
    <label class="vol">🔈<input id="listen-vol" type="range" min="0" max="100" value="70" aria-label="Volume" /></label>
    <div class="muted state" id="listen-state">Hear the music in your browser, in sync with the bot.</div>
    <audio id="listen-audio" preload="none"></audio>
  </div>
  <div id="app"><div class="card center muted">Loading…</div></div>
</div>
<script>
(() => {
  if (new URLSearchParams(location.search).get('embed')) document.documentElement.setAttribute('data-embed', '1');
  const KEY = 'maow.session';
  const m = location.hash.match(/maow_session=([^&]+)/);
  if (m) { try { localStorage.setItem(KEY, decodeURIComponent(m[1])); } catch {} history.replaceState(null, '', location.pathname + location.search); }
  const session = () => { try { return localStorage.getItem(KEY) || ''; } catch { return ''; } };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clock = (s) => {
    s = Math.max(0, Math.floor(s || 0));
    const h = Math.floor(s / 3600); const m = Math.floor((s % 3600) / 60); const sec = String(s % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
  };
  const api = async (path, body) => {
    const headers = { 'X-Maow-Session': session() };
    if (body) headers['Content-Type'] = 'application/json';
    const r = await fetch(path, body ? { method: 'POST', headers, body: JSON.stringify(body) } : { headers });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) throw Object.assign(new Error('signin'), { signin: true });
    if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
    return d;
  };
  const app = document.getElementById('app');
  let typing = false; let lastMsg = ''; let lastCls = '';
  let results = []; let skipMsg = ''; let skipCls = ''; let skipTimer = 0;

  const signIn = async () => {
    const r = await fetch('/api/auth/discord/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ next: 'listen' }) });
    const d = await r.json().catch(() => ({}));
    if (d.authUrl) location.href = d.authUrl; else alert(d.error || 'Sign-in is not available.');
  };
  const showSignIn = () => {
    app.innerHTML = `<div class="card center"><div style="font-size:34px">🎧</div><h1 style="font-size:18px;margin:8px 0">Join the listen room</h1>
      <p class="muted">Sign in with Discord to see what's playing and add songs.</p><button id="si">Sign in with Discord</button>
      <p class="muted" style="margin-top:14px">Only your username and avatar are read.</p></div>`;
    document.getElementById('si').onclick = signIn;
  };

  const render = (s) => {
    if (s.server) {
      document.getElementById('srv-name').textContent = `${s.server.name} · Listen room`;
      if (s.server.icon) document.getElementById('srv-icon').src = s.server.icon;
    }
    document.getElementById('you').textContent = `Signed in as ${s.you.tag}`;
    const np = s.nowPlaying;
    const keep = document.getElementById('q')?.value || '';
    app.innerHTML = `
      <div class="card">
        <h2>${s.paused ? '⏸ Paused' : '▶ Now playing'}</h2>
        ${np ? `<div class="np">${np.thumbnail ? `<img src="${esc(np.thumbnail)}" alt="">` : ''}<div><div class="t">${esc(np.name)}</div>
          <div class="muted">${clock(s.currentTime)} / ${clock(np.duration)}${np.by ? ` · added by ${esc(np.by)}` : ''}</div></div></div>
          <div class="bar"><i style="width:${np.duration ? Math.min(100, (s.currentTime / np.duration) * 100) : 0}%"></i></div>`
        : `<div class="muted">${s.mode === 'web' ? 'Nothing is playing. The bot isn\'t in a voice call, so songs you add play right here in the browser for everyone on this page.' : 'Nothing is playing right now.'}</div>`}
        <div class="np-row">
          ${s.voice ? `<div class="muted">🔊 ${esc(s.voice.name)} · ${s.voice.listeners.map((n) => `<span class="pill">${esc(n)}</span>`).join('') || 'nobody listening'}</div>`
            : s.mode === 'web' && np ? `<div class="muted">🌐 Browser only · ${(s.web?.listeners || []).map((n) => `<span class="pill">${esc(n)}</span>`).join('') || 'just you'}</div>` : '<div class="muted"></div>'}
          ${np && s.canPause ? `<button type="button" class="ghost" id="pause" data-paused="${s.paused ? 1 : 0}">${s.paused ? '▶ Resume' : '⏸ Pause'}</button>` : ''}
          ${np ? '<button type="button" class="ghost" id="skip" title="Skip (or vote to skip)">⏭ Skip</button>' : ''}
        </div>
        <div class="msg ${skipCls}" id="skip-msg">${esc(skipMsg)}</div>
      </div>
      <div class="card"><h2>Add a song</h2>
        <form id="add"><input id="q" placeholder="${s.canAdd ? 'Search a song, or paste a YouTube / Spotify link' : 'Not available right now'}" ${s.canAdd ? '' : 'disabled'} maxlength="300" autocomplete="off" />
        <button ${s.canAdd ? '' : 'disabled'}>Search</button></form><div class="msg ${lastCls}" id="msg">${esc(lastMsg)}</div>
        ${results.length ? `<ul class="results">${results.map((r, i) => `<li>${r.thumbnail ? `<img src="${esc(r.thumbnail)}" alt="" loading="lazy">` : ''}
          <div class="info"><div>${esc(r.name)}</div><div class="muted">${esc(r.by || '')} · ${clock(r.duration)}</div></div>
          <button type="button" data-pick="${i}">Add</button></li>`).join('')}</ul>` : ''}</div>
      <div class="card"><h2>Up next</h2>${s.upNext.length ? `<ol>${s.upNext.map((u) => `<li>${esc(u.name)}${u.by ? ` <span class="muted">· ${esc(u.by)}</span>` : ''}</li>`).join('')}</ol>${s.more ? `<div class="muted" style="margin-top:6px">+ ${s.more} more</div>` : ''}` : '<div class="muted">The queue is empty.</div>'}</div>`;
    const q = document.getElementById('q');
    q.value = keep;
    q.addEventListener('focus', () => { typing = true; });
    q.addEventListener('blur', () => { typing = false; });
    const add = async (query) => {
      try { await api('/api/listen/add', { query }); lastMsg = '✓ Added to the queue'; lastCls = 'ok'; q.value = ''; results = []; }
      catch (err) { lastMsg = err.signin ? 'Please sign in again.' : err.message; lastCls = 'err'; }
      typing = false; tick();
      setTimeout(() => { lastMsg = ''; }, 6000);
    };
    document.getElementById('add').onsubmit = async (e) => {
      e.preventDefault();
      const query = q.value.trim();
      if (!query) return;
      const btn = e.target.querySelector('button'); btn.disabled = true;
      if (/^https?:\/\//i.test(query)) return add(query);         // a link: add it straight away
      try {
        results = (await api(`/api/listen/search?q=${encodeURIComponent(query)}`)).results || [];
        lastMsg = results.length ? 'Pick one:' : 'No songs found for that.'; lastCls = results.length ? '' : 'err';
      } catch (err) { lastMsg = err.signin ? 'Please sign in again.' : err.message; lastCls = 'err'; }
      typing = false; tick();
    };
    app.querySelectorAll('[data-pick]').forEach((b) => b.onclick = () => {
      const r = results[Number(b.dataset.pick)];
      if (!r) return;
      app.querySelectorAll('[data-pick]').forEach((x) => { x.disabled = true; });
      add(r.url);
    });
    const pause = document.getElementById('pause');
    if (pause) pause.onclick = async () => {
      pause.disabled = true;
      try { await api('/api/listen/pause', { paused: pause.dataset.paused !== '1' }); }
      catch (err) { skipMsg = err.message; skipCls = 'err'; }
      tick();
    };
    const skip = document.getElementById('skip');
    if (skip) skip.onclick = async () => {
      skip.disabled = true;
      try { const r = await api('/api/listen/skip', {}); skipMsg = r.message; skipCls = r.ok ? 'ok' : 'err'; }
      catch (err) { skipMsg = err.signin ? 'Please sign in again.' : err.message; skipCls = 'err'; }
      tick();
      clearTimeout(skipTimer); skipTimer = setTimeout(() => { skipMsg = ''; }, 8000);
    };
  };

  // ===== Listen in the browser =====
  // The bot streams what it plays (/api/listen/audio) from where it is now.
  // We note where the stream started; if what you hear drifts from the bot by
  // more than a few seconds (or the song changes, or it was paused), we reload.
  const player = document.getElementById('player');
  const audio = document.getElementById('listen-audio');
  const btn = document.getElementById('listen-btn');
  const vol = document.getElementById('listen-vol');
  const note = document.getElementById('listen-state');
  const DRIFT_S = 6;
  let listening = false; let startAt = 0; let songKey = null; let stale = false; let retryAt = 0;
  try { vol.value = localStorage.getItem('maow.listen.vol') || vol.value; } catch {}
  audio.volume = vol.value / 100;
  vol.oninput = () => { audio.volume = vol.value / 100; try { localStorage.setItem('maow.listen.vol', vol.value); } catch {} };
  const say = (html) => { note.innerHTML = html; };
  const start = (s) => {
    startAt = s.currentTime || 0;
    songKey = s.nowPlaying?.url || s.nowPlaying?.name || null;
    stale = false;
    audio.src = `/api/listen/audio?session=${encodeURIComponent(session())}&t=${Date.now()}`;
    audio.play().catch(() => say('Your browser blocked the sound: press 🎧 Listen here again.'));
    say('Connecting…');
  };
  const stopAudio = () => { audio.pause(); audio.removeAttribute('src'); audio.load(); };
  audio.addEventListener('playing', () => say('<span class="eq"><i></i><i></i><i></i></span> Playing in your browser, in sync with the bot.'));
  // A song ran out: ask for the next one now instead of at the next 4 s check.
  audio.addEventListener('ended', () => { if (listening) { stale = true; retryAt = 0; setTimeout(tick, 400); } });
  audio.addEventListener('waiting',() => { if (listening) say('Loading…'); });
  audio.addEventListener('error', () => {
    if (!listening || !audio.getAttribute('src')) return;
    say('Couldn\'t play this song in the browser. Trying again shortly…');
    stale = true; retryAt = Date.now() + 8000;
  });
  btn.onclick = () => {
    listening = !listening;
    btn.textContent = listening ? '■ Stop listening' : '🎧 Listen here';
    btn.classList.toggle('on', listening);
    if (!listening) { stopAudio(); say('Stopped. The bot keeps playing in voice.'); return; }
    if (lastState?.nowPlaying && !lastState.paused) start(lastState); else say('Waiting for music…');
  };
  let lastState = null;
  const follow = (s) => {
    lastState = s;
    player.hidden = false;
    if (!listening) {
      say(s.mode === 'web' ? 'Hear it in your browser, in sync with everyone on this page.' : 'Hear the music in your browser, in sync with the bot.');
      return;
    }
    const key = s.nowPlaying?.url || s.nowPlaying?.name || null;
    if (!s.nowPlaying) { if (audio.getAttribute('src')) stopAudio(); songKey = null; return say('Waiting for music…'); }
    if (s.paused) { if (!audio.paused) audio.pause(); stale = true; return say(s.mode === 'web' ? '⏸ Paused.' : '⏸ Paused by the bot.'); }
    if (stale && Date.now() < retryAt) return;
    const heard = startAt + (audio.currentTime || 0);
    const live = !s.nowPlaying.duration;
    const drift = !live && !audio.paused && Math.abs(heard - (s.currentTime || 0)) > DRIFT_S;
    if (key !== songKey || stale || !audio.getAttribute('src') || drift) start(s);
  };

  const tick = async () => {
    if (typing) return;
    try { const s = await api('/api/listen/state'); render(s); follow(s); }
    catch (e) {
      if (e.signin) { player.hidden = true; return showSignIn(); }
      app.innerHTML = `<div class="card center muted">${esc(e.message)}</div>`;
    }
  };
  tick();
  setInterval(tick, 4000);
})();
</script>
</body>
</html>
