name: smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Install with --ignore-scripts so postinstall runs in its own step.
      # We still install ffmpeg-static which downloads ffmpeg; this can be slow.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Parse-check index.js
        run: node -c index.js

      - name: Parse-check deploy-commands.js
        run: node -c deploy-commands.js

      - name: Require-test every command + lib + event file
        run: |
          node -e "
            const fs=require('fs');const p=require('path');
            const fails=[];
            for (const d of ['lib','commands','events']) {
              const dir=p.join(process.cwd(),d);
              if (!fs.existsSync(dir)) continue;
              for (const f of fs.readdirSync(dir).filter(x=>x.endsWith('.js'))) {
                try { require(p.join(dir,f)); }
                catch (e) { fails.push(d+'/'+f+': '+e.message.split(String.fromCharCode(10))[0]); }
              }
            }
            if (fails.length) {
              console.error('::error::'+fails.length+' failures');
              fails.forEach(f => console.error(f));
              process.exit(1);
            }
            console.log('All', fs.readdirSync('commands').filter(f=>f.endsWith('.js')).length, 'commands + lib files load OK');
          "

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      - name: Validate dashboard HTML can be served
        run: |
          node -e "
            const fs=require('fs');
            const html=fs.readFileSync('public/dashboard.html','utf8');
            if (!html.includes('<title>')) { console.error('::error::dashboard.html missing <title>'); process.exit(1); }
            if (!html.includes('app.js')) { console.error('::error::dashboard.html does not load app.js'); process.exit(1); }
            console.log('dashboard.html OK');
          "

      - name: Lint Python GUI syntax
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -c "
          import ast, sys
          ast.parse(open('gui/control_panel.pyw', encoding='utf-8').read())
          print('Python GUI parses OK')
          "
