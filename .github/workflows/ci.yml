name: MaowCore

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # Install with --ignore-scripts so postinstall runs in its own step.
      # We still install ffmpeg-static which downloads ffmpeg; this can be slow.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Parse-check index.js
        run: node -c index.js

      - name: Parse-check deploy-commands.js
        run: node -c deploy-commands.js

      - name: Require-test every command + lib + event file
        run: |
          node -e "
            const fs=require('fs');const p=require('path');
            const fails=[];
            for (const d of ['lib','commands','events']) {
              const dir=p.join(process.cwd(),d);
              if (!fs.existsSync(dir)) continue;
              for (const f of fs.readdirSync(dir).filter(x=>x.endsWith('.js'))) {
                try { require(p.join(dir,f)); }
                catch (e) { fails.push(d+'/'+f+': '+e.message.split(String.fromCharCode(10))[0]); }
              }
            }
            if (fails.length) {
              console.error('::error::'+fails.length+' failures');
              fails.forEach(f => console.error(f));
              process.exit(1);
            }
            console.log('All', fs.readdirSync('commands').filter(f=>f.endsWith('.js')).length, 'commands + lib files load OK');
          "

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      # Every slash command against Discord's rules (one bad command breaks all of them)
      - name: Validate slash commands
        run: npm run validate

      # The full test suite (before v3.7.0 CI only checked that files load).
      # Failing tests are also posted as an annotation, so they show on the run's
      # summary page instead of being buried in ~1800 log lines.
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee test-output.txt; then
            msg=$(grep -E "^\s*not ok" -A 30 test-output.txt | grep -vE "^\s*(duration_ms|type:|\.\.\.|---)" | head -150 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Failing tests::${msg}"
            exit 1
          fi

      - name: Build dashboard (SvelteKit)
        run: npm install --no-audit --no-fund && npm run build
        working-directory: dashboard

      - name: Lint Python GUI syntax
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -c "
          import ast, sys
          ast.parse(open('gui/control_panel.pyw', encoding='utf-8').read())
          print('Python GUI parses OK')
          "
